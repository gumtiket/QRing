<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="QRing" />
  <title>QRing</title>
</head>
<body>
  <h1>QRing</h1>
  <p>QR로 공지하고, QR로 구독하는 알림 채널.</p>

  <section>
    <h2>채널을 운영하시나요?</h2>
    <a href="/new"><button>채널 만들기</button></a>
  </section>

  <section>
    <h2>초대받은 채널에 참여하시나요?</h2>
    <p>받으신 QR을 카메라로 찍으면 바로 구독 화면으로 이동합니다.</p>
    <p>QR이 없다면 채널 코드를 입력하세요.</p>
    <form id="join-form">
      <input type="text" id="code-input" maxlength="6" placeholder="6자리 코드" autocapitalize="characters" />
      <button type="submit">참여하기</button>
    </form>
    <p id="status"></p>
  </section>

  <script src="/index.js"></script>
</body>
</html>
